<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Info Form</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #ffffff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 420px; }
        h2 { margin-top: 0; color: #0f172a; margin-bottom: 0.5rem; }
        p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
        input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: #00ad9f; box-shadow: 0 0 0 3px rgba(0, 173, 159, 0.15); }
        button { background: #00ad9f; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #008f82; }
        .hidden { display: none; }
        .success-message { text-align: center; padding: 2rem 0; color: #0f172a; }
        .success-message h3 { color: #00ad9f; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Form Element -->
        <form id="contact-form" name="customer-info" method="POST" data-netlify="true">
            <h2>Customer Info</h2>
            <p class="subtitle">Please submit your details below.</p>
            
            <p class="hidden">
                <label>Don't fill this out if you're human: <input name="bot-field" /></label>
            </p>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Jane Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="jane@example.com">
            </div>

            <div class="form-group">
                <label for="notes">Additional Information</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Tell us what you need..."></textarea>
            </div>

            <button type="submit">Submit Information</button>
        </form>

        <!-- Hidden Thank You Message Container -->
        <div id="thank-you" class="success-message hidden">
            <h3>Thank You!</h3>
            <p>Your information has been successfully submitted. We will be in touch soon.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById("contact-form");
        const thankYouDiv = document.getElementById("thank-you");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            fetch("/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                form.classList.add("hidden");
                thankYouDiv.classList.remove("hidden");
            })
            .catch((error) => alert("Form submission failed. Please try again."));
        });
    </script>
</body>
</html>
